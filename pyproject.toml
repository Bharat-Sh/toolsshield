[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "0.1.0"
description = "Agent operations platform: rollback, cost control, and testing for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AiGraf" },
]
keywords = ["ai", "agent", "safety", "guardrails", "rollback", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/aigraf/agentshield"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
