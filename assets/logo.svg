<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M256 28 L462 100 C462 100 472 280 380 390 C320 460 256 488 256 488 C256 488 192 460 132 390 C40 280 50 100 50 100 Z"
        fill="url(#shieldGrad)" stroke="none"/>
  <!-- Inner shield highlight -->
  <path d="M256 60 L430 120 C430 120 438 272 358 370 C306 430 256 454 256 454 C256 454 206 430 154 370 C74 272 82 120 82 120 Z"
        fill="none" stroke="url(#innerGrad)" stroke-width="3" opacity="0.5"/>
  <!-- Circuit/network lines -->
  <g stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.9">
    <!-- Horizontal lines -->
    <line x1="160" y1="200" x2="352" y2="200"/>
    <line x1="180" y1="260" x2="332" y2="260"/>
    <line x1="200" y1="320" x2="312" y2="320"/>
    <!-- Vertical connections -->
    <line x1="210" y1="200" x2="210" y2="260"/>
    <line x1="302" y1="200" x2="302" y2="260"/>
    <line x1="256" y1="260" x2="256" y2="320"/>
  </g>
  <!-- Nodes/dots -->
  <g fill="#FFFFFF">
    <circle cx="160" cy="200" r="8"/>
    <circle cx="210" cy="200" r="6"/>
    <circle cx="256" cy="200" r="8"/>
    <circle cx="302" cy="200" r="6"/>
    <circle cx="352" cy="200" r="8"/>
    <circle cx="180" cy="260" r="6"/>
    <circle cx="210" cy="260" r="8"/>
    <circle cx="256" cy="260" r="8"/>
    <circle cx="302" cy="260" r="8"/>
    <circle cx="332" cy="260" r="6"/>
    <circle cx="200" cy="320" r="6"/>
    <circle cx="256" cy="320" r="8"/>
    <circle cx="312" cy="320" r="6"/>
  </g>
  <!-- Central shield checkmark -->
  <path d="M230 256 L250 276 L290 226" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
</svg>
